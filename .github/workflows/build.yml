name: AutoSentry Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate sdkmanager
        id: sdk
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT}" >&2
            find "${ANDROID_SDK_ROOT}" -maxdepth 4 >&2 || true
            exit 1
          fi
          chmod +x "$SDKMANAGER"
          echo "sdkmanager=${SDKMANAGER}" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        run: |
          yes | "$SDKMANAGER" --licenses --sdk_root="${ANDROID_SDK_ROOT}" || true

      - name: Install Android SDK packages
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        run: |
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: autosentry-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: autosentry-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
